name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          gitleaks_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$gitleaks_dir/gitleaks.tar.gz"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$gitleaks_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$gitleaks_dir/gitleaks.tar.gz" -C "$gitleaks_dir" gitleaks
          echo "$gitleaks_dir" >> "$GITHUB_PATH"

      - name: Verify leak detection and redaction
        run: python3 scripts/test-secret-scan.py

      - name: Scan repository history
        run: bash scripts/check-secrets.sh .

  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      UV_PYTHON: ${{ matrix.python }}
      AGENTPHILOSOPHY_SMOKE_PYTHON: ${{ matrix.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        run: uv python install "${{ matrix.python }}"

      - name: Check packaged source
        run: python3 scripts/sync-packaged-source.py --check

      - name: Lint
        run: uv run --locked ruff check .

      - name: Test
        run: uv run --locked pytest -q

      - name: Validate central source
        run: uv run --locked sync.py validate

      - name: Build package
        run: uv build

      - name: Smoke test installed CLI
        run: bash scripts/release-smoke.sh
