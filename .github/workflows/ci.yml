name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-package:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Validate central source
        run: uv run sync.py validate

      - name: Build package
        run: uv build

      - name: Smoke test installed CLI
        run: bash scripts/release-smoke.sh
