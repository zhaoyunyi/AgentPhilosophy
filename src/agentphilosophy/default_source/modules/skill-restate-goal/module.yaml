name: skill-restate-goal
description: 用自己的话重述用户当前目标与待解决问题的共享理解 skill
source_kind: internal
version: 1.0.0
project_types: [orchestrator, fullstack, frontend, mobile-sdk]
requires: []
conflicts: []
provides:
  - skill:restate-goal
outputs:
  - id: restate-goal-skill
    type: rendered_file
    template: templates/SKILL.md.j2
    target: "{{ skill_targets.repo_skills }}/restate-goal/SKILL.md"
    strategy: managed_replace
    on_existing_unmanaged: report_only
  - id: restate-goal-openai-metadata
    type: rendered_file
    template: templates/agents/openai.yaml.j2
    target: "{{ skill_targets.repo_skills }}/restate-goal/agents/openai.yaml"
    strategy: managed_replace
    on_existing_unmanaged: report_only
  - id: restate-goal-codex-skill
    type: rendered_file
    template: templates/SKILL.md.j2
    target: "{{ skill_targets.codex_project }}/restate-goal/SKILL.md"
    strategy: managed_replace
    on_existing_unmanaged: report_only
  - id: restate-goal-codex-openai-metadata
    type: rendered_file
    template: templates/agents/openai.yaml.j2
    target: "{{ skill_targets.codex_project }}/restate-goal/agents/openai.yaml"
    strategy: managed_replace
    on_existing_unmanaged: report_only
