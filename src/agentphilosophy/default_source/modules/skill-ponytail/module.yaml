name: skill-ponytail
description: Ponytail 精简编码阶梯、复用优先和不过度工程项目级 skill
version: 1.1.1
project_types: [orchestrator, fullstack, frontend, mobile-sdk]
requires: []
conflicts: []
upstream:
  repository: https://github.com/DietrichGebert/ponytail
  ref: refs/tags/v4.10.0
  revision: 1d95ff7d39de12d87014ea40d4e22201bddc501b
  tracked_paths:
    - LICENSE
    - README.md
    - skills/ponytail/SKILL.md
provides:
  - skill:ponytail
outputs:
  - id: ponytail-skill
    type: rendered_file
    template: templates/SKILL.md.j2
    target: "{{ skill_targets.repo_skills }}/ponytail/SKILL.md"
    strategy: managed_replace
    on_existing_unmanaged: report_only
  - id: ponytail-codex-skill
    type: rendered_file
    template: templates/SKILL.md.j2
    target: "{{ skill_targets.codex_project }}/ponytail/SKILL.md"
    strategy: managed_replace
    on_existing_unmanaged: report_only
  - id: ponytail-files
    type: copy_tree
    source: files
    target: "{{ skill_targets.repo_skills }}/ponytail"
    strategy: managed_replace
    on_existing_unmanaged: report_only
  - id: ponytail-codex-files
    type: copy_tree
    source: files
    target: "{{ skill_targets.codex_project }}/ponytail"
    strategy: managed_replace
    on_existing_unmanaged: report_only
