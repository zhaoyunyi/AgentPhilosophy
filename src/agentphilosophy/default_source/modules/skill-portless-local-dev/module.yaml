name: skill-portless-local-dev
description: Portless 稳定本地 URL、按需安装、项目脚本改造和本地验收入口 skill
version: 1.5.0
project_types: [orchestrator, fullstack, frontend, mobile-sdk]
requires: []
conflicts: []
upstream:
  repository: https://github.com/vercel-labs/portless
  ref: refs/tags/v0.15.6
  revision: 713f84dec04b5328c02ffc62d1937b27a80fbc5f
  tracked_paths:
    - CHANGELOG.md
    - LICENSE
    - README.md
    - packages/portless/package.json
    - skills/portless/SKILL.md
provides:
  - skill:portless-local-dev
outputs:
  - id: portless-local-dev-skill
    type: rendered_file
    template: templates/SKILL.md.j2
    target: "{{ skill_targets.repo_skills }}/portless-local-dev/SKILL.md"
    strategy: managed_replace
    on_existing_unmanaged: report_only
  - id: portless-local-dev-codex-skill
    type: rendered_file
    template: templates/SKILL.md.j2
    target: "{{ skill_targets.codex_project }}/portless-local-dev/SKILL.md"
    strategy: managed_replace
    on_existing_unmanaged: report_only
  - id: portless-local-dev-files
    type: copy_tree
    source: files
    target: "{{ skill_targets.repo_skills }}/portless-local-dev"
    strategy: managed_replace
    on_existing_unmanaged: report_only
  - id: portless-local-dev-codex-files
    type: copy_tree
    source: files
    target: "{{ skill_targets.codex_project }}/portless-local-dev"
    strategy: managed_replace
    on_existing_unmanaged: report_only
