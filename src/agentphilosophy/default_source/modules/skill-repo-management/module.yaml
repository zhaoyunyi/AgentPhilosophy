name: skill-repo-management
description: 仓库状态、文档索引、提交边界和清理规则 skill
source_kind: internal
version: 1.2.0
project_types: [orchestrator, fullstack, frontend, mobile-sdk]
requires: []
conflicts: []
provides:
  - skill:repo-management
outputs:
  - id: repo-management-skill
    type: rendered_file
    template: templates/SKILL.md.j2
    target: "{{ skill_targets.repo_skills }}/repo-management/SKILL.md"
    strategy: managed_replace
    on_existing_unmanaged: report_only
  - id: repo-management-codex-skill
    type: rendered_file
    template: templates/SKILL.md.j2
    target: "{{ skill_targets.codex_project }}/repo-management/SKILL.md"
    strategy: managed_replace
    on_existing_unmanaged: report_only
