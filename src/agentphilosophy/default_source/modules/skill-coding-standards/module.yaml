name: skill-coding-standards
description: 编码、审查和测试入口 skill
version: 1.1.0
project_types: [orchestrator, fullstack, frontend, mobile-sdk]
requires: []
conflicts: []
provides:
  - skill:coding-standards
outputs:
  - id: coding-standards-skill
    type: rendered_file
    template: templates/SKILL.md.j2
    target: "{{ skill_targets.repo_skills }}/coding-standards/SKILL.md"
    strategy: managed_replace
    on_existing_unmanaged: report_only
  - id: coding-standards-codex-skill
    type: rendered_file
    template: templates/SKILL.md.j2
    target: "{{ skill_targets.codex_project }}/coding-standards/SKILL.md"
    strategy: managed_replace
    on_existing_unmanaged: report_only
