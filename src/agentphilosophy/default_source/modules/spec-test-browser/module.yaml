name: spec-test-browser
description: 浏览器端 e2e 和 Browser Use 验收规范
version: 1.0.0
project_types: [fullstack, frontend, mobile-sdk]
requires: [doc-templates]
conflicts: []
provides:
  - spec:test-browser
outputs:
  - id: browser-test-spec
    type: rendered_file
    template: templates/BrowserTestSpec.md.j2
    target: "{{ paths.spec_dir }}/BrowserTestSpec.md"
    strategy: managed_replace
    on_existing_unmanaged: report_only
  - id: browser-test-fragment
    type: fragment
    template: templates/browser-test-rules.md.j2
    target: AGENTS.md
    section: testing
    order: 20
