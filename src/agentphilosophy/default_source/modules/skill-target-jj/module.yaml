name: skill-target-jj
description: 进入目标 jj 仓库时的操作 skill
source_kind: internal
version: 1.1.0
project_types: [orchestrator, fullstack, frontend, mobile-sdk]
requires: []
conflicts: []
provides:
  - skill:target-jj
outputs:
  - id: target-jj-skill
    type: rendered_file
    template: templates/SKILL.md.j2
    target: "{{ skill_targets.repo_skills }}/target-jj/SKILL.md"
    strategy: managed_replace
    on_existing_unmanaged: report_only
  - id: target-jj-codex-skill
    type: rendered_file
    template: templates/SKILL.md.j2
    target: "{{ skill_targets.codex_project }}/target-jj/SKILL.md"
    strategy: managed_replace
    on_existing_unmanaged: report_only
