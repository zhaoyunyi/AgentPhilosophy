name: skill-loop-check
description: 按仓库生成巡检清单，按日或事件触发检查、修复、退役与 PR 闭环
source_kind: internal
version: 1.0.1
project_types: [orchestrator, fullstack, frontend, mobile-sdk]
requires: []
conflicts: []
provides:
  - skill:loop-check
outputs:
  - id: loop-check-skill
    type: rendered_file
    template: templates/SKILL.md.j2
    target: "{{ skill_targets.repo_skills }}/loop-check/SKILL.md"
    strategy: managed_replace
    on_existing_unmanaged: report_only
  - id: loop-check-codex-skill
    type: rendered_file
    template: templates/SKILL.md.j2
    target: "{{ skill_targets.codex_project }}/loop-check/SKILL.md"
    strategy: managed_replace
    on_existing_unmanaged: report_only
  - id: loop-check-files
    type: copy_tree
    source: files
    target: "{{ skill_targets.repo_skills }}/loop-check"
    strategy: managed_replace
    on_existing_unmanaged: report_only
  - id: loop-check-codex-files
    type: copy_tree
    source: files
    target: "{{ skill_targets.codex_project }}/loop-check"
    strategy: managed_replace
    on_existing_unmanaged: report_only
