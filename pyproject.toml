[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentphilosophy"
version = "1.2.1"
description = "Central Agent collaboration specification sync tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "code-review-graph==2.3.9",
  "Jinja2>=3.1.6",
  "PyYAML>=6.0",
]

[project.scripts]
agentphilosophy-sync = "agentphilosophy.cli:main"
code-review-graph = "code_review_graph.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools]
include-package-data = false
