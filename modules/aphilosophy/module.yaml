name: aphilosophy
description: Agent 哲学决策框架——元决策原则、架构设计与治理冲突解决协议
version: 1.1.0
project_types: [orchestrator, fullstack, frontend, mobile-sdk]
requires: []
conflicts: []
provides:
  - philosophy:meta-decisions
  - philosophy:architecture-conflicts
  - philosophy:governance-conflicts
outputs:
  - id: meta-decision-principles
    type: rendered_file
    template: templates/meta-decision-principles.md.j2
    target: "{{ paths.philosophy_dir | default('aphilosophy') }}/meta-decision-principles.md"
    strategy: managed_replace
    on_existing_unmanaged: report_only
  - id: architecture-conflict-resolution
    type: rendered_file
    template: templates/architecture-conflict-resolution.md.j2
    target: "{{ paths.philosophy_dir | default('aphilosophy') }}/architecture-conflict-resolution.md"
    strategy: managed_replace
    on_existing_unmanaged: report_only
  - id: governance-conflict-resolution
    type: rendered_file
    template: templates/governance-conflict-resolution.md.j2
    target: "{{ paths.philosophy_dir | default('aphilosophy') }}/governance-conflict-resolution.md"
    strategy: managed_replace
    on_existing_unmanaged: report_only
