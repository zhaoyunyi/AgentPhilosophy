name: spec-bdd
description: BDD 用户行为验收规范
source_kind: internal
version: 1.2.0
project_types: [orchestrator, fullstack, frontend, mobile-sdk]
requires: [doc-templates]
conflicts: []
provides:
  - spec:bdd
outputs:
  - id: bdd-spec
    type: rendered_file
    template: templates/BDDSpec.md.j2
    target: "{{ paths.spec_dir }}/BDDSpec.md"
    strategy: layered
    on_existing_unmanaged: report_only
  - id: bdd-agents-fragment
    type: fragment
    template: templates/bdd-rules.md.j2
    target: AGENTS.md
    section: testing
    order: 10
