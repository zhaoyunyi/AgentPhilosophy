name: skill-improve-codebase-architecture
description: 代码库架构加深评审、浅模块识别和重构候选报告 skill
version: 1.0.0
project_types: [orchestrator, fullstack, frontend, mobile-sdk]
requires: []
conflicts: []
provides:
  - skill:improve-codebase-architecture
outputs:
  - id: improve-codebase-architecture-skill
    type: rendered_file
    template: templates/SKILL.md.j2
    target: "{{ skill_targets.repo_skills }}/improve-codebase-architecture/SKILL.md"
    strategy: managed_replace
    on_existing_unmanaged: report_only
  - id: improve-codebase-architecture-codex-skill
    type: rendered_file
    template: templates/SKILL.md.j2
    target: "{{ skill_targets.codex_project }}/improve-codebase-architecture/SKILL.md"
    strategy: managed_replace
    on_existing_unmanaged: report_only
