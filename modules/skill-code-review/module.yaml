name: skill-code-review
description: 独立 code-review 双轴审查项目级 skill
version: 1.2.0
project_types: [orchestrator, fullstack, frontend, mobile-sdk]
requires: []
conflicts:
  - skill-mattpocock-engineering
upstream:
  repository: https://github.com/mattpocock/skills
  ref: main
  revision: 6654f6b60cd9d5be8b54c6fafe44346dabeb3b76
  tracked_paths:
    - README.md
    - LICENSE
    - skills/engineering/code-review
provides:
  - skill:code-review
outputs:
  - id: code-review-skill
    type: rendered_file
    template: templates/SKILL.md.j2
    target: "{{ skill_targets.repo_skills }}/code-review/SKILL.md"
    strategy: managed_replace
    on_existing_unmanaged: report_only
  - id: code-review-codex-skill
    type: rendered_file
    template: templates/SKILL.md.j2
    target: "{{ skill_targets.codex_project }}/code-review/SKILL.md"
    strategy: managed_replace
    on_existing_unmanaged: report_only
  - id: code-review-files
    type: copy_tree
    source: files
    target: "{{ skill_targets.repo_skills }}/code-review"
    strategy: managed_replace
    on_existing_unmanaged: report_only
  - id: code-review-codex-files
    type: copy_tree
    source: files
    target: "{{ skill_targets.codex_project }}/code-review"
    strategy: managed_replace
    on_existing_unmanaged: report_only
